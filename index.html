<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siyer Yolum</title>
<style>
:root{--deniz:#cfe3ee;--kara:#efe6d2;--kiyi:#b9ad92;--bg:#f6f1e7;--kart:#fffdf8;--yazi:#2a2a2a;--soluk:#7a7468;--vurgu:#1f6f5c;--cizgi:#e4dccb;--r:14px;--font:Georgia,'Times New Roman',serif}
body[data-mod=cocuk]{--deniz:#bfe6f5;--kara:#ffe9b8;--kiyi:#f0c56a;--bg:#fff6e0;--kart:#fff;--vurgu:#f08a24;--cizgi:#ffd9a0;--r:26px;--font:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--yazi);font-family:var(--font);line-height:1.55;font-size:17px}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--cizgi);padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
h1{margin:0;font-size:1.15em;color:var(--vurgu)}
.mod{display:flex;background:var(--cizgi);border-radius:99px;padding:3px}
.mod button{border:0;background:none;padding:6px 14px;border-radius:99px;color:var(--soluk)}
.mod button.on{background:var(--vurgu);color:#fff}
main{max-width:560px;margin:0 auto;padding:16px}
.ilerleme{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:12px 16px;margin-bottom:8px}
.bar{height:8px;background:var(--cizgi);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--vurgu);transition:width .4s}
.donem{margin-top:28px}
.donem h2{margin:0;font-size:1.05em;padding:10px 16px;border-radius:var(--r);color:#fff;background:var(--renk)}
.donem small{display:block;opacity:.85;font-weight:normal;font-size:.8em}
.yol{position:relative;padding:8px 0}
.yol::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--cizgi);transform:translateX(-50%)}
.dugum{position:relative;display:flex;margin:14px 0}
.dugum:nth-child(odd){justify-content:flex-start;padding-right:50%}
.dugum:nth-child(even){justify-content:flex-end;padding-left:50%}
.dugum button{display:flex;gap:10px;align-items:center;text-align:left;background:var(--kart);border:2px solid var(--renk);border-radius:var(--r);padding:8px 12px;margin:0 22px;width:100%;box-shadow:0 2px 0 var(--renk)}
.dugum .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--renk);color:#fff;display:grid;place-items:center;font-weight:bold}
.dugum.bitti .no::after{content:"✓"}.dugum.bitti .no span{display:none}
.dugum .t{font-size:.85em;line-height:1.25}.dugum .t em{display:block;color:var(--soluk);font-style:normal;font-size:.8em}
.dugum.yakinda button{opacity:.55;border-style:dashed;box-shadow:none}
.ders{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10;display:none}
.ders.ac{display:block}
.ders .ic{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.geri{border:0;background:none;color:var(--vurgu);padding:6px 0;font-size:1em}
.yil{display:inline-block;background:var(--renk);color:#fff;border-radius:99px;padding:2px 12px;font-size:.85em}
.ders h3{font-size:1.5em;margin:8px 0}
.ozet{background:var(--kart);border-left:5px solid var(--renk);padding:12px 14px;border-radius:var(--r)}
.zaman{margin:18px 0;padding-left:18px;border-left:3px solid var(--renk)}
.olay{position:relative;margin-bottom:16px}
.olay::before{content:"";position:absolute;left:-26px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--renk)}
.olay b{display:block}.olay .kaynak{font-size:.8em;color:var(--soluk)}
body[data-mod=cocuk] .olay b::before{content:attr(data-e) " "}
.btn{background:var(--vurgu);color:#fff;border:0;border-radius:99px;padding:12px 22px;width:100%;margin-top:8px}
.sik{display:block;width:100%;text-align:left;background:var(--kart);border:2px solid var(--cizgi);border-radius:var(--r);padding:12px;margin:8px 0}
.sik.dogru{border-color:#2e9d5b;background:#e5f6ec}.sik.yanlis{border-color:#d34a4a;background:#fbe8e8}
.aciklama{color:var(--soluk);font-size:.9em;margin:6px 0}
.sinavlar{display:grid;gap:10px;margin-top:12px}.sinav{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--kart);border:2px solid var(--vurgu);border-radius:var(--r);padding:12px 14px}.sinav em{font-style:normal;color:var(--soluk);font-size:.8em}
.harita{margin:14px 0}.harita svg{display:block;width:100%;height:auto;border-radius:var(--r);border:1px solid var(--cizgi)}.hcap{font-size:.75em;color:var(--soluk);margin-top:4px}
.yakinda-not{text-align:center;color:var(--soluk);padding:40px 0}
</style>
</head>
<body data-mod="buyuk">
<header><h1>🌙 Siyer Yolum</h1>
<div class="mod"><button data-m="cocuk">🧒 Çocuk</button><button data-m="buyuk" class="on">📖 Büyük</button></div></header>
<main id="ana"></main>
<div class="ders" id="ders"><div class="ic" id="ic"></div></div>

<script src="data.js"></script>
<script>
/* ===== DURUM ===== */
let mod='buyuk',biten={};
try{mod=localStorage.getItem('sy_mod')||mod;biten=JSON.parse(localStorage.getItem('sy_biten')||'{}')}catch(e){}
const $=s=>document.querySelector(s);
const kaydet=()=>{try{localStorage.setItem('sy_mod',mod);localStorage.setItem('sy_biten',JSON.stringify(biten))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function modUygula(){document.body.dataset.mod=mod;document.querySelectorAll('.mod button').forEach(b=>b.classList.toggle('on',b.dataset.m===mod))}
document.querySelectorAll('.mod button').forEach(b=>b.onclick=()=>{mod=b.dataset.m;kaydet();modUygula();ana();if($('#ders').classList.contains('ac'))ders(aktif.d,aktif.dn)});

function ana(){
  const tum=DONEMLER.flatMap(d=>d.dersler),n=tum.filter(x=>biten[x.id]).length;
  let h=`<div class="ilerleme">${mod==='cocuk'?'⭐ Yolculuğumuz':'İlerleme'}: <b>${n}</b> / ${tum.length} ders<div class="bar"><i style="width:${n/tum.length*100}%"></i></div></div>`;
  let no=0;
  DONEMLER.forEach(d=>{
    h+=`<section class="donem" style="--renk:${d.renk}"><h2>${d.ad}<small>${d.alt}</small></h2><div class="yol">`;
    d.dersler.forEach(x=>{no++;const var_=!!x.cocuk;
      h+=`<div class="dugum ${biten[x.id]?'bitti':''} ${var_?'':'yakinda'}"><button data-d="${d.id}" data-i="${x.id}"><span class="no"><span>${no}</span></span><span class="t">${esc(x.baslik)}<em>${x.yil}${var_?'':' · yakında'}</em></span></button></div>`});
    h+='</div></section>'});
  h+=`<section class="donem" style="--renk:#1f6f5c"><h2>${mod==='cocuk'?'🎯 Sınavlar':'Bölüm Sınavları'}<small>Soruları ilgili derslerden gelir</small></h2><div class="sinavlar">`;
  SINAVLAR.forEach(z=>{const n=soruHavuzu(z).length,en=biten[z.id];
    h+=`<button class="sinav" data-z="${z.id}"><span>${esc(z.ad)}</span><em>${n} soru${en!=null?' · en iyi '+en:''}</em></button>`});
  h+='</div></section>';
  $('#ana').innerHTML=h;
  document.querySelectorAll('.sinav').forEach(b=>b.onclick=()=>bolumSinavi(SINAVLAR.find(z=>z.id===b.dataset.z)));
  document.querySelectorAll('.dugum button').forEach(b=>b.onclick=()=>{
    const d=DONEMLER.find(x=>x.id===b.dataset.d);ders(d,d.dersler.find(x=>x.id===b.dataset.i))});
}

function harita(id){
  const H=HARITA[id];if(!H)return'';
  const P=H.yer.map(k=>Object.assign({k},YERLER[k]));
  const lons=P.map(p=>p.lon),lats=P.map(p=>p.lat);
  const mn=a=>Math.min(...a),mx=a=>Math.max(...a);
  const cLon=(mn(lons)+mx(lons))/2,cLat=(mn(lats)+mx(lats))/2;
  const u=Math.max((mx(lons)-mn(lons))*0.9*1.5/4,(mx(lats)-mn(lats))*1.5/3,0.9),sc=320/(4*u);
  const X=lo=>160+(lo-cLon)*0.9*sc,Y=la=>120-(la-cLat)*sc,pt=(la,lo)=>X(lo).toFixed(1)+','+Y(la).toFixed(1);
  const fs=mod==='cocuk'?14:11;
  let g='<svg viewBox="0 0 320 240" role="img" aria-label="Şematik harita"><rect width="320" height="240" fill="var(--deniz)"/>';
  KARA.forEach(a=>g+=`<polygon points="${a.map(v=>pt(v[0],v[1])).join(' ')}" fill="var(--kara)" stroke="var(--kiyi)" stroke-width="1.2"/>`);
  const sx=X(38.6),sy=Y(20.2);
  if(sx>30&&sx<290&&sy>20&&sy<220)g+=`<text x="${sx}" y="${sy}" text-anchor="middle" font-size="10" font-style="italic" fill="var(--soluk)" transform="rotate(-35 ${sx} ${sy})">Kızıldeniz</text>`;
  if(H.yol)g+=`<polyline points="${H.yol.map(k=>pt(YERLER[k].lat,YERLER[k].lon)).join(' ')}" fill="none" stroke="var(--renk)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round"/>`;
  P.forEach(p=>{const x=X(p.lon),y=Y(p.lat),sol=x>220;
    g+=`<circle cx="${x}" cy="${y}" r="${mod==='cocuk'?9:5}" fill="var(--renk)" stroke="#fff" stroke-width="2"/>`;
    if(mod==='cocuk')g+=`<text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="11">${p.e}</text>`;
    g+=`<text x="${x+(sol?-13:13)}" y="${y+4}" text-anchor="${sol?'end':'start'}" font-size="${fs}" font-weight="bold" fill="var(--yazi)" stroke="var(--kara)" stroke-width="3" paint-order="stroke">${esc(p.ad)}</text>`});
  return `<div class="harita">${g}</svg><div class="hcap">Şematik harita, ölçekli değildir.</div></div>`;
}
let aktif={};
function ders(d,x){
  aktif={d,dn:x};const el=$('#ders');el.style.setProperty('--renk',d.renk);el.classList.add('ac');el.scrollTop=0;
  const i=$('#ic');
  let h=`<button class="geri" id="geri">← Yola dön</button><div><span class="yil">${x.yil}</span> <small>${d.ad}</small></div><h3>${esc(x.baslik)}</h3>`;
  const v=x[mod];
  if(!v){i.innerHTML=h+`<div class="yakinda-not">${mod==='cocuk'?'🚧 Bu ders yakında hazır olacak!':'Bu dersin içeriği daha sonra eklenecek.'}</div>`;$('#geri').onclick=kapat;return}
  h+=`<div class="ozet">${esc(v.ozet)}</div>`+harita(x.id)+`<div class="zaman">`;
  v.olaylar.forEach(o=>h+=`<div class="olay"><b data-e="${o.e||''}">${esc(o.b)}</b>${esc(o.m)}${o.k?`<div class="kaynak">Kaynak: ${esc(o.k)}</div>`:''}</div>`);
  h+=`</div><button class="btn" id="soru">${mod==='cocuk'?'🎯 Hadi soruları çözelim!':'Kısa sınav'}</button>`;
  i.innerHTML=h;$('#geri').onclick=kapat;$('#soru').onclick=()=>quiz(x.sorular,0,0,x.id,()=>ders(aktif.d,x));
}
function kapat(){$('#ders').classList.remove('ac');ana()}

function soruHavuzu(z){return DONEMLER.filter(d=>z.donemler.includes(d.id)).flatMap(d=>d.dersler).flatMap(x=>x.sorular||[])}
function karistir(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bolumSinavi(z){
  const el=$('#ders');el.style.setProperty('--renk','#1f6f5c');el.classList.add('ac');el.scrollTop=0;
  quiz(karistir(soruHavuzu(z)).slice(0,10),0,0,z.id,kapat,z.ad);
}
function quiz(S,k,puan,anahtar,geri,baslik){
  const i=$('#ic');
  if(k>=S.length){
    biten[anahtar]=anahtar.startsWith('s-')?Math.max(biten[anahtar]||0,puan):1;kaydet();
    i.innerHTML=`<button class="geri" id="geri">← Yola dön</button><div class="yakinda-not" style="color:var(--yazi)"><div style="font-size:3em">${mod==='cocuk'?'🏆':'✓'}</div><h3>${puan} / ${S.length} doğru</h3><p>${mod==='cocuk'?'Aferin!':'Tamamlandı.'}</p></div>`;
    $('#geri').onclick=kapat;return}
  const q=S[k];
  i.innerHTML=`<button class="geri" id="geri">← ${baslik?'Yola dön':'Derse dön'}</button><p><small>${baslik?esc(baslik)+' · ':''}Soru ${k+1}/${S.length}</small></p><h3>${esc(q.s)}</h3><div id="sec"></div><div class="aciklama" id="ac"></div>`;
  $('#geri').onclick=geri;
  q.sec.forEach((s,j)=>{const b=document.createElement('button');b.className='sik';b.textContent=s;
    b.onclick=()=>{[...document.querySelectorAll('.sik')].forEach((e,n)=>{e.disabled=true;if(n===q.d)e.classList.add('dogru')});
      if(j!==q.d)b.classList.add('yanlis');
      $('#ac').textContent=q.a;const ok=j===q.d?1:0;
      const n=document.createElement('button');n.className='btn';n.textContent='Devam';n.onclick=()=>quiz(S,k+1,puan+ok,anahtar,geri,baslik);$('#ac').after(n)};
    $('#sec').append(b)});
}
modUygula();ana();
</script>
</body>
</html>
